    <main>
      <h1>FAÇA SEU LOGIN</h1>
<section class="formulario">
      <form
        action="daniel09andrade11@gmail.com"
        method="post"
        enctype="text/plain"></form>
        <label for="nome" class="daniel">nome </label>
        <input class="oliveira" type="text" id="nome" placeholder="Digite seu nome" required />
        <br />
        <label for="email" class="daniel">email </label>
        <input class="oliveira"
          type="email"
          id="email"
          placeholder="Digite seu email"
          required
        />
        <br />
        <label for="idade" class="daniel">idade </label>
        <input class="oliveira"
          type="number"
          id="idade"
          name="idade"
          min="16"
          max="30"
          placeholder="Digite sua idade"
          required
        />
        <br />
        <label for="mensagem" class="daniel">mensagem </label>
        <textarea name="mensagem" id="mensagem" placeholder="Digite sua mensagem" required></textarea>
        <br />
        <button id="andrade" type="submit">Enviar</button>
      </form>
      </section>
    </main>
